---
layout: default
---
<section class="page active">
  <div class="page-header">
    <a href="{{ '/blog/' | relative_url }}" class="back-link">← Blog</a>
    <div class="blog-card-meta-row" style="margin-top:1rem">
      {% if page.tags %}
        <span class="blog-tag">{{ page.tags | first }}</span>
      {% endif %}
      <span class="blog-date">{{ page.date | date: "%b %d, %Y" }}</span>
    </div>
    <h1 class="section-title" style="margin-top:0.75rem">{{ page.title }}</h1>
  </div>
  <div class="blog-content" style="display:block;padding:0;border:none">
    {{ content }}
  </div>
</section>
