<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}Vishal Raika</title>
  <meta name="description" content="{{ site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body class="{% if page.url == '/' %}is-home{% endif %}{% unless page.url == '/' %} is-inner{% endunless %}">

<nav>
  <div class="nav-logo"></div>
  <ul class="nav-links">
    <li><a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a></li>
    <li><a href="{{ '/blog/' | relative_url }}" class="nav-link {% if page.url contains '/blog' %}active{% endif %}">Blog</a></li>
    <li><a href="{{ '/projects/' | relative_url }}" class="nav-link {% if page.url contains '/projects' %}active{% endif %}">Projects</a></li>
    <li><a href="{{ '/contact/' | relative_url }}" class="nav-link {% if page.url contains '/contact' %}active{% endif %}">Contact</a></li>
    <li><a href="{{ '/resume/' | relative_url }}" class="nav-link {% if page.url contains '/resume' %}active{% endif %}">Résumé</a></li>
  </ul>
</nav>

<main id="main-content">
  {{ content }}
</main>

{% if page.url == '/' %}
<script src="{{ '/assets/js/home-animation.js' | relative_url }}"></script>
{% endif %}

{% if page.layout == 'blog_index' %}
<script src="{{ '/assets/js/blog.js' | relative_url }}"></script>
{% endif %}

<script>
(function () {
  var cache = {};

  function prefetch(url) {
    if (cache[url]) return;
    cache[url] = fetch(url).then(function(r) { return r.text(); });
  }

  function extractMain(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var el = doc.getElementById('main-content');
    return el ? el.innerHTML : null;
  }

  function extractTitle(html) {
    var m = html.match(/<title>([^<]*)<\/title>/i);
    return m ? m[1] : document.title;
  }

  function updateNav(url) {
    document.querySelectorAll('.nav-link').forEach(function(a) {
      var norm = function(u) { return u.replace(/\/index\.html$/, '/').replace(/\/$/, ''); };
      a.classList.toggle('active', norm(a.href) === norm(url));
    });
  }

  function swapPage(url, html) {
    var newContent = extractMain(html);
    if (!newContent) { window.location.href = url; return; }
    var mc = document.getElementById('main-content');
    mc.innerHTML = newContent;
    document.title = extractTitle(html);
    window.scrollTo({ top: 0, behavior: 'instant' });
    updateNav(url);
    attachLinks();

    // Re-init page scripts
    var isHome = (url === window.location.origin + '/' || url.endsWith('/index.html') || url === window.location.origin);
    if (isHome) {
      var s = document.createElement('script');
      s.src = '/assets/js/home-animation.js?t=' + Date.now();
      document.body.appendChild(s);
    }
    var isBlog = url.includes('/blog');
    if (isBlog) {
      var b = document.createElement('script');
      b.src = '/assets/js/blog.js?t=' + Date.now();
      document.body.appendChild(b);
    }
  }

  function navigateTo(url) {
    if (url === window.location.href) return;
    if (!cache[url]) cache[url] = fetch(url).then(function(r) { return r.text(); });

    cache[url].then(function(html) {
      // View Transitions API — GPU composited, zero JS timing jank
      if (document.startViewTransition) {
        var t = document.startViewTransition(function() {
          swapPage(url, html);
          window.history.pushState({}, '', url);
        });
      } else {
        // Fallback for older browsers
        swapPage(url, html);
        window.history.pushState({}, '', url);
      }
    }).catch(function() {
      window.location.href = url;
    });
  }

  function isInternal(href) {
    if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) return false;
    try { return new URL(href, location.href).origin === location.origin; }
    catch(e) { return false; }
  }

  function attachLinks() {
    document.querySelectorAll('a[href]').forEach(function(link) {
      if (link._vrAttached) return;
      link._vrAttached = true;
      if (!isInternal(link.getAttribute('href'))) return;
      link.addEventListener('mouseenter', function() { prefetch(link.href); });
      link.addEventListener('click', function(e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        navigateTo(link.href);
      });
    });
  }

  window.addEventListener('popstate', function() { navigateTo(location.href); });
  attachLinks();
})();
</script>

</body>
</html>
