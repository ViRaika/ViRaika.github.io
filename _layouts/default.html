<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}Vishal Raika</title>
  <meta name="description" content="{{ site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body class="{% if page.url == '/' %}is-home{% endif %}{% unless page.url == '/' %} is-inner{% endunless %}">

<nav>
  <div class="nav-logo"></div>
  <ul class="nav-links">
    <li><a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a></li>
    <li><a href="{{ '/blog/' | relative_url }}" class="nav-link {% if page.url contains '/blog' %}active{% endif %}">Blog</a></li>
    <li><a href="{{ '/projects/' | relative_url }}" class="nav-link {% if page.url contains '/projects' %}active{% endif %}">Projects</a></li>
    <li><a href="{{ '/contact/' | relative_url }}" class="nav-link {% if page.url contains '/contact' %}active{% endif %}">Contact</a></li>
    <li><a href="{{ '/resume/' | relative_url }}" class="nav-link {% if page.url contains '/resume' %}active{% endif %}">Résumé</a></li>
  </ul>
</nav>

<main id="main-content">
  {{ content }}
</main>

{% if page.url == '/' %}
<script src="{{ '/assets/js/home-animation.js' | relative_url }}"></script>
{% endif %}

{% if page.layout == 'blog_index' %}
<script src="{{ '/assets/js/blog.js' | relative_url }}"></script>
{% endif %}

<script>
(function () {
  var isHome = document.body.classList.contains('is-home');
  var isInner = document.body.classList.contains('is-inner');

  // On inner pages entering — slide in from right
  if (isInner) {
    var mc = document.getElementById('main-content');
    mc.classList.add('slide-enter-right');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        mc.classList.add('slide-enter-active');
        mc.classList.remove('slide-enter-right');
      });
    });
  }

  // On home entering from inner — slide in from left
  if (isHome && document.referrer && document.referrer !== window.location.href) {
    var ref = document.referrer;
    var origin = window.location.origin;
    if (ref.startsWith(origin) && ref !== origin + '/') {
      var mc2 = document.getElementById('main-content');
      mc2.classList.add('slide-enter-left');
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          mc2.classList.add('slide-enter-active');
          mc2.classList.remove('slide-enter-left');
        });
      });
    }
  }

  // Intercept nav clicks
  document.querySelectorAll('a[href]').forEach(function (link) {
    var href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('mailto') || href.startsWith('http')) return;

    link.addEventListener('click', function (e) {
      e.preventDefault();
      var dest = link.href;
      var goingHome = (dest === window.location.origin + '/' || dest === window.location.origin + '/index.html');
      var mc = document.getElementById('main-content');

      if (isHome && !goingHome) {
        // Home → inner: slide out to left
        mc.classList.add('slide-exit-left');
      } else if (isInner && goingHome) {
        // Inner → home: slide out to right
        mc.classList.add('slide-exit-right');
      } else {
        // Inner → inner: simple fade
        mc.classList.add('page-leaving');
      }

      setTimeout(function () { window.location.href = dest; }, 340);
    });
  });
})();
</script>

</body>
</html>
