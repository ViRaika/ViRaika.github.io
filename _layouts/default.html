<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}Vishal Raika</title>
  <meta name="description" content="{{ site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body class="{% if page.url == '/' %}is-home{% endif %}{% unless page.url == '/' %} is-inner{% endunless %}">

<nav>
  <div class="nav-logo"></div>
  <ul class="nav-links">
    <li><a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a></li>
    <li><a href="{{ '/blog/' | relative_url }}" class="nav-link {% if page.url contains '/blog' %}active{% endif %}">Blog</a></li>
    <li><a href="{{ '/projects/' | relative_url }}" class="nav-link {% if page.url contains '/projects' %}active{% endif %}">Projects</a></li>
    <li><a href="{{ '/contact/' | relative_url }}" class="nav-link {% if page.url contains '/contact' %}active{% endif %}">Contact</a></li>
    <li><a href="{{ '/resume/' | relative_url }}" class="nav-link {% if page.url contains '/resume' %}active{% endif %}">Résumé</a></li>
  </ul>
</nav>

<main id="main-content">
  {{ content }}
</main>

{% if page.url == '/' %}
<script src="{{ '/assets/js/home-animation.js' | relative_url }}"></script>
{% endif %}

{% if page.layout == 'blog_index' %}
<script src="{{ '/assets/js/blog.js' | relative_url }}"></script>
{% endif %}

<script>
(function () {
  var mc = document.getElementById('main-content');

  // First-ever page load: gentle fade-up (no transition on revisit via swap)
  if (!sessionStorage.getItem('vr-navigated')) {
    mc.classList.add('page-first-load');
  }

  // Cache for prefetched pages
  var cache = {};

  // Prefetch a URL (fire-and-forget on hover)
  function prefetch(url) {
    if (cache[url]) return;
    cache[url] = fetch(url).then(function(r) { return r.text(); });
  }

  // Extract #main-content HTML from a fetched page string
  function extractMain(html) {
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, 'text/html');
    var newMain = doc.getElementById('main-content');
    return newMain ? newMain.innerHTML : null;
  }

  // Extract <title> from fetched page
  function extractTitle(html) {
    var m = html.match(/<title>([^<]*)<\/title>/i);
    return m ? m[1] : document.title;
  }

  // Perform the animated swap
  function navigateTo(url) {
    if (url === window.location.href) return;

    // Start fetching immediately (may already be cached from hover)
    if (!cache[url]) cache[url] = fetch(url).then(function(r) { return r.text(); });
    var fetchPromise = cache[url];

    // Fade out current content
    mc.classList.remove('page-first-load', 'page-in', 'page-in-active');
    mc.classList.add('page-out');

    // Wait for both: exit anim (180ms) AND fetch — whichever is slower
    var exitDone = new Promise(function(res) { setTimeout(res, 180); });

    Promise.all([fetchPromise, exitDone]).then(function(results) {
      var html = results[0];
      var newContent = extractMain(html);
      if (!newContent) { window.location.href = url; return; }

      // Swap content
      mc.innerHTML = newContent;
      document.title = extractTitle(html);
      window.history.pushState({ url: url }, '', url);
      sessionStorage.setItem('vr-navigated', '1');

      // Re-run any page-specific scripts (home-animation, blog)
      var isNowHome = (url === window.location.origin + '/' || url.endsWith('/index.html'));
      if (isNowHome && !document._homeAnimLoaded) {
        document._homeAnimLoaded = true;
        var s = document.createElement('script');
        s.src = '/assets/js/home-animation.js';
        document.body.appendChild(s);
      }

      // Update nav active state
      document.querySelectorAll('.nav-link').forEach(function(a) {
        a.classList.toggle('active', a.href === url || a.href === url.replace(/\/$/, ''));
      });

      // Animate in
      mc.classList.remove('page-out');
      mc.classList.add('page-in');
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          mc.classList.add('page-in-active');
          mc.classList.remove('page-in');
          // Scroll to top
          window.scrollTo({ top: 0, behavior: 'instant' });
          // Re-attach link listeners on new content
          attachLinks();
        });
      });
    }).catch(function() {
      // Fallback: hard navigate if fetch fails
      window.location.href = url;
    });
  }

  function isInternal(href) {
    if (!href) return false;
    if (href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) return false;
    try {
      var u = new URL(href, window.location.href);
      return u.origin === window.location.origin;
    } catch(e) { return false; }
  }

  function attachLinks() {
    document.querySelectorAll('a[href]').forEach(function(link) {
      if (link._vrAttached) return;
      link._vrAttached = true;
      var href = link.getAttribute('href');
      if (!isInternal(href)) return;

      // Prefetch on hover
      link.addEventListener('mouseenter', function() { prefetch(link.href); });

      link.addEventListener('click', function(e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        navigateTo(link.href);
      });
    });
  }

  // Handle browser back/forward
  window.addEventListener('popstate', function(e) {
    navigateTo(window.location.href);
  });

  attachLinks();
})();
</script>

</body>
</html>
