<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}Vishal Raika</title>
  <meta name="description" content="{{ site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body class="{% if page.url == '/' %}is-home{% endif %}">

{% if page.url == '/' %}
<canvas id="home-canvas"></canvas>
{% endif %}

<nav>
  <div class="nav-logo"></div>
  <ul class="nav-links">
    <li><a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a></li>
    <li><a href="{{ '/blog/' | relative_url }}" class="nav-link {% if page.url contains '/blog' %}active{% endif %}">Blog</a></li>
    <li><a href="{{ '/projects/' | relative_url }}" class="nav-link {% if page.url contains '/projects' %}active{% endif %}">Projects</a></li>
    <li><a href="{{ '/contact/' | relative_url }}" class="nav-link {% if page.url contains '/contact' %}active{% endif %}">Contact</a></li>
    <li><a href="{{ '/resume/' | relative_url }}" class="nav-link {% if page.url contains '/resume' %}active{% endif %}">Résumé</a></li>
  </ul>
</nav>

<main id="main-content">
  {{ content }}
</main>

{% if page.url == '/' %}
<script src="{{ '/assets/js/home-animation.js' | relative_url }}"></script>
{% endif %}

{% if page.layout == 'blog_index' %}
<script src="{{ '/assets/js/blog.js' | relative_url }}"></script>
{% endif %}

<script>
// Page transition: fade out on nav click, let browser navigate
(function() {
  var links = document.querySelectorAll('a[href]');
  links.forEach(function(link) {
    var href = link.getAttribute('href');
    // only internal links, not anchors
    if (!href || href.startsWith('#') || href.startsWith('mailto') || href.startsWith('http')) return;
    link.addEventListener('click', function(e) {
      e.preventDefault();
      var target = link.href;
      document.getElementById('main-content').classList.add('page-leaving');
      setTimeout(function() { window.location.href = target; }, 320);
    });
  });
})();
</script>

</body>
</html>
